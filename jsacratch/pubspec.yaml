name: jsacratch
description: "Jsacratch - A dual-mode bot script editor for CsAC (acratch + JS modes)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  re_editor: 0.9.0
  re_highlight: 0.0.3
  file_selector: ^1.1.0
  shared_preferences: ^2.5.3
  http: ^1.4.0
  path: ^1.9.1
  archive: ^3.6.1
  flutter_animate: ^4.5.2
  window_manager: ^0.5.1
  webview_all: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/l10n/
