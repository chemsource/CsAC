name: acop_flutter
description: "CsAC Open Platform - Bot Management Console"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  intl: ^0.19.0
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: MapleMono
      fonts:
        - asset: font/MapleMono-NF-CN-Medium.ttf
          weight: 500
