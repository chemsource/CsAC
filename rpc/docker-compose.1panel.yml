services:
  csac-backend:
    build:
      context: .
      dockerfile: Dockerfile.scratch
    container_name: csac-backend
    restart: always
    environment:
      CSAC_HTTP_ADDR: 0.0.0.0:8080
      CSAC_DB_HOST: localhost
      CSAC_DB_USER: admin
      CSAC_DB_PASS: "123456"
      CSAC_DB_NAME: csac
      CSAC_CACHE_SALT: "123456"
      CSAC_UPLOAD_DIR: /data/upload
      CSAC_PRIVATE_UPLOAD_DIR: /data/uploads/chat
      CSAC_SMTP_HOST: your_smtp_host
      CSAC_SMTP_PORT: "465"
      CSAC_SMTP_SECURE: ssl
      CSAC_SMTP_USERNAME: your_smtp_username
      CSAC_SMTP_PASSWORD: your_smtp_password
      CSAC_SMTP_FROM_EMAIL: your_smtp_from_email
      CSAC_SMTP_FROM_NAME: CsAC
    volumes:
      - ./csac-backend:/app/csac-backend:ro
      - ../upload:/data/upload
      - ../uploads/chat:/data/uploads/chat
      - /etc/ssl/certs:/etc/ssl/certs:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
