location = /healthz {
    proxy_pass http://127.0.0.1:18081/healthz;
    add_header Alt-Svc 'h3=":443"; ma=2592000';
}
location ^~ /rpc/ {
    proxy_pass http://127.0.0.1:18081;
}
location = /UniCsAC.php {
    proxy_pass http://127.0.0.1:18081;
}
location ^~ /api/ {
    proxy_pass http://127.0.0.1:18081/;
}
location = /ws/v2 {
    proxy_pass http://127.0.0.1:18081;
}
location = /rpc/ws/v2 {
    proxy_pass http://127.0.0.1:18081/ws/v2;
}
location = /ws {
    proxy_pass http://127.0.0.1:18081;
}
location = /websocket.php {
    proxy_pass http://127.0.0.1:18081;
}
location = /rpc/ws {
    proxy_pass http://127.0.0.1:18081/ws;
}
location = /rpc/websocket.php {
    proxy_pass http://127.0.0.1:18081/websocket.php;
}
location = /acop {
    proxy_pass http://127.0.0.1:18083/;
}
location ^~ /acop/ {
    proxy_pass http://127.0.0.1:18083/;
}
location ^~ /bot/internal/ {
    return 404;
}
location ^~ /bot/ {
    proxy_pass http://127.0.0.1:18082;
}
location ^~ /emapps/internal/ {
    return 404;
}
location ^~ /emapps/ {
    proxy_pass http://127.0.0.1:18084;
}
location ^~ /upload/files/ {
    alias /www/sites/csac/data/upload/files/;
    types {

    }
    default_type application/octet-stream;
    add_header Content-Disposition attachment;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /uploads/chat/files/ {
    alias /www/sites/csac/data/uploads/chat/files/;
    types {

    }
    default_type application/octet-stream;
    add_header Content-Disposition attachment;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /upload/ {
    alias /www/sites/csac/data/upload/;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /uploads/chat/ {
    alias /www/sites/csac/data/uploads/chat/;
    add_header X-Content-Type-Options nosniff always;
}
location ~ /\. {
    return 404;
}
location / {
    try_files $uri $uri/ /index.html;
}
