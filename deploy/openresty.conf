server {
    listen 80 ;
    listen [::]:80 ;
    listen 443 ssl ;
    listen 443 quic ;
    listen [::]:443 ssl ;
    listen [::]:443 quic ;
    http2 on;
    server_name csac.chat;
    ssl_certificate /www/sites/csac/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/csac/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    include /www/shared/cloudflare-realip.conf;
    access_log /www/sites/csac/log/access.log csac_safe;
    error_log /www/sites/csac/log/error.log error;
    root /www/sites/csac/index;
    index index.html;
    client_max_body_size 16m;
    client_body_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    if ($csac_origin_allowed = 0) {
        return 403;
    }
    if ($csac_cross_site_api = 1) {
        return 403;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $csac_connection_upgrade;
    proxy_connect_timeout 3s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    proxy_cache off;
    proxy_cookie_flags ~ secure httponly samesite=lax;
    if ($scheme = http) {
        return 308 https://csac.chat$request_uri;
    }
    location ^~ /.well-known/acme-challenge/ {
        root /www/shared/certbot/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }
    ssl_prefer_server_ciphers off;
    error_page 497 https://$host$request_uri;
    add_header Alt-Svc 'h3=":443"; ma=2592000';
    include /www/sites/csac/proxy/*.conf;
}
