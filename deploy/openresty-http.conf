map $http_upgrade $csac_connection_upgrade {
    default upgrade;
    '' close;
}

map $http_origin $csac_origin_allowed {
    default 0;
    '' 1;
    'https://csac.chat' 1;
}

map "$http_sec_fetch_site:$uri" $csac_cross_site_api {
    default 0;
    ~^cross-site:/(rpc/|api/|acop|bot/|emapps/|ws(?:/|$)|websocket\.php$|UniCsAC\.php$) 1;
}

log_format csac_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';
